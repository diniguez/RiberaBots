<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZONA</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --yellow: #FFE135;
    --orange: #FF6B35;
    --pink: #FF3D9A;
    --purple: #7B2FBE;
    --blue: #00B4D8;
    --green: #06D6A0;
    --red: #FF4444;
    --white: #FFFFFF;
    --dark: #1A0533;
    --bg1: #FF6B35;
    --bg2: #7B2FBE;
    --bg3: #00B4D8;
    --shadow: 0 12px 40px rgba(0,0,0,0.3);
    --radius: 40px;
    --font-title: 'Fredoka One', cursive;
    --font-body: 'Nunito', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--dark);
    font-family: var(--font-body);
    user-select: none;
  }

  /* ===== VIEWS ===== */
  .view {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    opacity: 0; pointer-events: none;
    transition: opacity 0.4s ease;
    overflow: hidden;
  }
  .view.active { opacity: 1; pointer-events: all; }

  /* ===== BOUNCING STARS BG ===== */
  .stars-bg {
    position: absolute; inset: 0; overflow: hidden; z-index: 0;
  }
  .star {
    position: absolute; font-size: 4rem;
    animation: floatStar linear infinite;
    opacity: 0.15;
  }
  @keyframes floatStar {
    0% { transform: translateY(110vh) rotate(0deg); }
    100% { transform: translateY(-20vh) rotate(360deg); }
  }

  /* ===== NAV BTN ===== */
  .nav-btn {
    position: absolute; top: 60px; right: 60px; z-index: 100;
    background: var(--white);
    border: none; border-radius: 50px;
    padding: 28px 52px;
    font-family: var(--font-body); font-weight: 900; font-size: 2.2rem;
    cursor: pointer; color: var(--dark);
    box-shadow: 0 8px 0 rgba(0,0,0,0.25);
    transition: transform 0.1s, box-shadow 0.1s;
    display: flex; align-items: center; gap: 16px;
    white-space: nowrap;
  }
  .nav-btn:active { transform: translateY(6px); box-shadow: 0 2px 0 rgba(0,0,0,0.25); }
  .nav-btn .icon { font-size: 2.4rem; }

  /* ========== VIEW 1 ========== */
  #view1 {
    background: linear-gradient(160deg, #FF6B35 0%, #FF3D9A 50%, #7B2FBE 100%);
    align-items: center; justify-content: flex-start;
  }

  .v1-top {
    width: 100%; padding: 60px 0 20px;
    display: flex; align-items: center; justify-content: center;
    position: relative; z-index: 10;
  }

  .zona-text {
    font-family: var(--font-title);
    font-size: 11rem; color: var(--white);
    letter-spacing: 0.15em;
    text-shadow: 0 10px 0 rgba(0,0,0,0.25), 0 0 80px rgba(255,255,255,0.3);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.04); }
  }

  .v1-center {
    flex: 1; display: flex; align-items: center; justify-content: center;
    position: relative; z-index: 10;
  }

  .big-number {
    font-family: var(--font-title);
    font-size: 60vw;
    line-height: 0.85;
    color: var(--white);
    text-shadow: 0 20px 0 rgba(0,0,0,0.2), 0 0 200px rgba(255,255,255,0.15);
    animation: bigBounce 3s ease-in-out infinite;
  }
  @keyframes bigBounce {
    0%,100% { transform: scale(1) rotate(-2deg); }
    50% { transform: scale(1.03) rotate(2deg); }
  }

  /* ========== VIEW 2 ========== */
  #view2 {
    background: linear-gradient(160deg, #0D1B4B 0%, #1A0533 60%, #0D2B1B 100%);
    padding: 50px 60px; gap: 40px;
  }

  .v2-header {
    display: flex; align-items: center; justify-content: space-between;
    position: relative; z-index: 10;
  }

  .v2-title {
    font-family: var(--font-title); font-size: 6rem; color: var(--yellow);
    text-shadow: 0 6px 0 rgba(0,0,0,0.3);
  }

  /* DB METER */
  .db-section {
    position: relative; z-index: 10;
    background: rgba(255,255,255,0.07);
    border-radius: var(--radius); padding: 50px;
    border: 4px solid rgba(255,255,255,0.1);
    flex: 1;
  }

  .db-display {
    display: flex; align-items: flex-end; justify-content: center;
    gap: 0; margin-bottom: 40px;
  }

  .db-number {
    font-family: var(--font-title); font-size: 14rem; line-height: 1;
    color: var(--white);
    text-shadow: 0 0 60px var(--green);
    transition: color 0.3s;
  }
  .db-unit {
    font-family: var(--font-title); font-size: 5rem; color: rgba(255,255,255,0.5);
    padding-bottom: 20px; margin-left: 12px;
  }

  .emoji-display {
    font-size: 8rem; text-align: center; margin-bottom: 30px;
    transition: transform 0.2s;
    display: block;
  }

  /* BARS */
  .bars-container {
    display: flex; align-items: flex-end; justify-content: center;
    gap: 14px; height: 200px;
  }
  .bar {
    flex: 1; border-radius: 20px 20px 8px 8px;
    transition: height 0.1s ease, background 0.2s;
    max-width: 60px;
    background: var(--green);
  }

  /* SCALE BAR */
  .scale-bar {
    width: 100%; height: 36px; border-radius: 18px;
    background: linear-gradient(to right, #06D6A0, #FFE135, #FF6B35, #FF3D9A, #FF0000);
    position: relative; margin: 30px 0 10px;
    border: 4px solid rgba(255,255,255,0.2);
    overflow: visible;
  }
  .scale-needle {
    position: absolute; top: -14px;
    width: 12px; height: 60px;
    background: white; border-radius: 6px;
    transform: translateX(-50%);
    box-shadow: 0 0 20px rgba(255,255,255,0.8);
    transition: left 0.15s ease;
    left: 0%;
  }
  .scale-labels {
    display: flex; justify-content: space-between;
    color: rgba(255,255,255,0.5); font-size: 1.8rem; font-weight: 800;
    padding: 0 4px;
  }

  /* CONTROLS */
  .controls {
    position: relative; z-index: 10;
    display: grid; grid-template-columns: 1fr 1fr; gap: 28px;
    align-items: center;
  }

  .team-input-row {
    grid-column: 1 / -1;
    display: flex; gap: 28px; align-items: center;
  }

  .team-input {
    flex: 1; padding: 30px 40px;
    border-radius: 30px; border: 4px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.1);
    font-family: var(--font-body); font-size: 3rem; font-weight: 900;
    color: var(--white); outline: none;
    transition: border-color 0.2s, background 0.2s;
  }
  .team-input::placeholder { color: rgba(255,255,255,0.35); }
  .team-input:focus {
    border-color: var(--yellow); background: rgba(255,225,53,0.1);
  }

  .big-btn {
    display: flex; align-items: center; justify-content: center; gap: 18px;
    padding: 32px 44px; border-radius: 30px; border: none;
    font-family: var(--font-body); font-weight: 900; font-size: 2.6rem;
    cursor: pointer; color: var(--white);
    box-shadow: 0 8px 0 rgba(0,0,0,0.3);
    transition: transform 0.1s, box-shadow 0.1s;
    white-space: nowrap;
  }
  .big-btn:active { transform: translateY(6px); box-shadow: 0 2px 0 rgba(0,0,0,0.3); }
  .big-btn .icon { font-size: 3rem; }

  .btn-start { background: linear-gradient(135deg, #06D6A0, #00B4D8); }
  .btn-stop  { background: linear-gradient(135deg, #FF4444, #FF6B35); }
  .btn-save  { background: linear-gradient(135deg, #7B2FBE, #FF3D9A); }
  .btn-table { background: linear-gradient(135deg, #FFE135, #FF6B35); color: var(--dark); }

  .big-btn:disabled { opacity: 0.4; cursor: default; transform: none; }

  /* STATUS */
  .status-dot {
    width: 28px; height: 28px; border-radius: 50%;
    background: #444; display: inline-block; margin-right: 14px;
    vertical-align: middle; transition: background 0.3s;
  }
  .status-dot.recording {
    background: #FF4444;
    animation: blink 0.8s ease-in-out infinite;
  }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

  .recording-label {
    font-size: 2.4rem; font-weight: 900; color: rgba(255,255,255,0.6);
    display: flex; align-items: center;
  }
  .recording-label.active { color: #FF4444; }

  /* ========== VIEW 3 ========== */
  #view3 {
    background: linear-gradient(160deg, #00B4D8 0%, #7B2FBE 60%, #FF3D9A 100%);
    padding: 60px; gap: 40px;
  }

  .v3-header {
    display: flex; align-items: center; justify-content: space-between;
    position: relative; z-index: 10;
  }

  .v3-title {
    font-family: var(--font-title); font-size: 6rem; color: var(--white);
    text-shadow: 0 6px 0 rgba(0,0,0,0.25);
  }

  .scores-list {
    position: relative; z-index: 10;
    flex: 1; overflow-y: auto;
    display: flex; flex-direction: column; gap: 28px;
    padding-right: 10px;
  }
  .scores-list::-webkit-scrollbar { width: 12px; }
  .scores-list::-webkit-scrollbar-track { background: rgba(255,255,255,0.1); border-radius: 6px; }
  .scores-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.4); border-radius: 6px; }

  .score-card {
    background: rgba(255,255,255,0.15);
    border-radius: var(--radius);
    padding: 40px 60px;
    display: flex; align-items: center; gap: 40px;
    backdrop-filter: blur(10px);
    border: 4px solid rgba(255,255,255,0.2);
    animation: slideIn 0.4s ease;
  }
  @keyframes slideIn { from { opacity:0; transform:translateX(-40px); } to { opacity:1; transform:none; } }

  .score-rank {
    font-family: var(--font-title); font-size: 5rem; color: var(--yellow);
    min-width: 100px; text-align: center;
    text-shadow: 0 4px 0 rgba(0,0,0,0.3);
  }

  .score-team {
    flex: 1; font-size: 3.8rem; font-weight: 900; color: var(--white);
  }

  .score-db-wrap { text-align: right; }
  .score-db {
    font-family: var(--font-title); font-size: 5.5rem; color: var(--yellow);
    line-height: 1;
  }
  .score-db-label { font-size: 2rem; color: rgba(255,255,255,0.6); font-weight: 700; }

  .score-bar-mini {
    width: 100%; height: 18px; border-radius: 9px;
    background: rgba(255,255,255,0.15); overflow: hidden; margin-top: 16px;
    grid-column: 1/-1;
  }
  .score-bar-fill {
    height: 100%; border-radius: 9px;
    background: linear-gradient(to right, #06D6A0, #FFE135, #FF6B35, #FF0000);
    transition: width 0.6s ease;
  }

  .empty-state {
    text-align: center; padding: 120px 60px;
    font-size: 4rem; color: rgba(255,255,255,0.5); font-weight: 800;
  }
  .empty-emoji { font-size: 10rem; display: block; margin-bottom: 30px; }

  /* ========== TOAST ========== */
  .toast {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(200px);
    background: rgba(30,20,50,0.97); color: white;
    padding: 30px 60px; border-radius: 40px;
    font-size: 2.8rem; font-weight: 900;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    z-index: 999; transition: transform 0.4s ease;
    text-align: center; white-space: nowrap;
    border: 4px solid rgba(255,255,255,0.15);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* ========== RESPONSIVE ADJUSTMENTS ========== */
  /* The kiosk is 2160×3840 at 200% scale = effective 1080×1920 */
  /* We design for 1080×1920 viewport */
</style>
</head>
<body>

<!-- ======= VIEW 1 ======= -->
<div class="view active" id="view1">
  <div class="stars-bg" id="stars1"></div>
  <div class="v1-top">
    <div class="zona-text">🎉 ZONA 🎉</div>
    <button class="nav-btn" onclick="goTo(2)">
      <span class="icon">🎤</span> Empezar
    </button>
  </div>
  <div class="v1-center">
    <div class="big-number">1</div>
  </div>
</div>

<!-- ======= VIEW 2 ======= -->
<div class="view" id="view2">
  <div class="stars-bg" id="stars2"></div>

  <div class="v2-header">
    <div class="v2-title">🎤 Medidor de Gritos</div>
    <button class="nav-btn" onclick="goTo(1)">
      <span class="icon">🏠</span> Inicio
    </button>
  </div>

  <div class="db-section">
    <div class="db-display">
      <span class="db-number" id="dbNumber">--</span>
      <span class="db-unit">dB</span>
    </div>
    <span class="emoji-display" id="dbEmoji">🎙️</span>
    <div class="bars-container" id="barsContainer"></div>
    <div class="scale-bar">
      <div class="scale-needle" id="scaleNeedle"></div>
    </div>
    <div class="scale-labels">
      <span>60 dB</span><span>75 dB</span><span>90 dB</span><span>105 dB</span><span>120 dB</span>
    </div>
    <div style="margin-top:20px;display:flex;align-items:center;gap:20px;">
      <span class="status-dot" id="statusDot"></span>
      <span class="recording-label" id="recordingLabel">En espera...</span>
    </div>
  </div>

  <div class="controls">
    <div class="team-input-row">
      <input class="team-input" id="teamName" type="text" placeholder="✏️ Nombre del equipo..." maxlength="30">
    </div>
    <button class="big-btn btn-start" id="btnStart" onclick="startRecording()">
      <span class="icon">▶️</span> Empezar a grabar
    </button>
    <button class="big-btn btn-stop" id="btnStop" onclick="stopRecording()" disabled>
      <span class="icon">⏹️</span> Terminar
    </button>
    <button class="big-btn btn-save" id="btnSave" onclick="saveScore()" disabled>
      <span class="icon">💾</span> Guardar puntuación
    </button>
    <button class="big-btn btn-table" onclick="goTo(3)">
      <span class="icon">🏆</span> Ver tabla
    </button>
  </div>
</div>

<!-- ======= VIEW 3 ======= -->
<div class="view" id="view3">
  <div class="stars-bg" id="stars3"></div>

  <div class="v3-header">
    <div class="v3-title">🏆 Tabla de Puntuaciones</div>
    <button class="nav-btn" onclick="goTo(2)">
      <span class="icon">🎤</span> Volver
    </button>
  </div>

  <div class="scores-list" id="scoresList"></div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ===== NAVIGATION =====
let currentView = 1;
function goTo(n) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view' + n).classList.add('active');
  currentView = n;
  if (n === 3) renderScores();
}

// ===== TOAST =====
function showToast(msg, duration = 2500) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), duration);
}

// ===== STARS BACKGROUND =====
function createStars(containerId, count = 14) {
  const c = document.getElementById(containerId);
  const symbols = ['⭐','🌟','✨','💫','🎈','🎉','🎊','💥','🌈','🦄','🍭','🎵'];
  for (let i = 0; i < count; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    s.style.left = (Math.random() * 90 + 5) + '%';
    s.style.fontSize = (3 + Math.random() * 5) + 'rem';
    s.style.animationDuration = (8 + Math.random() * 12) + 's';
    s.style.animationDelay = (-Math.random() * 15) + 's';
    s.style.opacity = (0.08 + Math.random() * 0.14).toString();
    c.appendChild(s);
  }
}
createStars('stars1', 12);
createStars('stars2', 8);
createStars('stars3', 10);

// ===== BARS SETUP =====
const NUM_BARS = 32;
const barsContainer = document.getElementById('barsContainer');
const bars = [];
for (let i = 0; i < NUM_BARS; i++) {
  const b = document.createElement('div');
  b.className = 'bar';
  b.style.height = '10px';
  barsContainer.appendChild(b);
  bars.push(b);
}

// ===== DECIBEL SCALE (60-120 dB, logarithmic perception) =====
// Maps raw analyzer values (0-255) to perceptual dB (60-120)
// Uses logarithmic mapping since dB is already logarithmic
function rawToDb(raw) {
  if (raw <= 0) return 60;
  // raw 0-255 → dB 60-120
  // We use log mapping: dBperceived feels linear to us but underlying
  // energy ratio is log. We map so small sound → 60dB, loud → 120dB
  const normalized = raw / 255; // 0-1
  // Apply sqrt to emphasize lower values (mic preamp dynamics)
  const curved = Math.pow(normalized, 0.5);
  return Math.round(60 + curved * 60);
}

// Needle position: 60→0%, 120→100% linear in dB space
function dbToNeedlePercent(db) {
  return Math.max(0, Math.min(100, ((db - 60) / 60) * 100));
}

// Emoji thresholds (dB):
// <65: silent, 65-75: murmur, 75-85: normal, 85-95: excited, 95-105: yelling, 105-115: screaming, >115: EPIC
function dbToEmoji(db) {
  if (db < 65) return '😴';
  if (db < 75) return '🙂';
  if (db < 85) return '😃';
  if (db < 90) return '😄';
  if (db < 95) return '🤩';
  if (db < 100) return '🥳';
  if (db < 105) return '🗣️';
  if (db < 110) return '📢';
  if (db < 115) return '🔥';
  return '🤯';
}

// Bar color thresholds
function dbToBarColor(db) {
  if (db < 75) return '#06D6A0';
  if (db < 85) return '#FFE135';
  if (db < 95) return '#FF6B35';
  if (db < 105) return '#FF3D9A';
  return '#FF0000';
}

// ===== AUDIO =====
let audioCtx = null, analyser = null, sourceNode = null, streamRef = null;
let animFrameId = null;
let isRecording = false;
let maxDbSession = 60;
let lastDb = 60;

async function startRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    streamRef = stream;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    analyser.smoothingTimeConstant = 0.7;
    sourceNode = audioCtx.createMediaStreamSource(stream);
    sourceNode.connect(analyser);

    isRecording = true;
    maxDbSession = 60;
    document.getElementById('btnStart').disabled = true;
    document.getElementById('btnStop').disabled = false;
    document.getElementById('btnSave').disabled = true;

    const dot = document.getElementById('statusDot');
    const label = document.getElementById('recordingLabel');
    dot.classList.add('recording');
    label.classList.add('active');
    label.textContent = '🔴 GRABANDO...';

    loop();
  } catch(e) {
    showToast('❌ No se pudo acceder al micrófono');
    console.error(e);
  }
}

function loop() {
  if (!isRecording) return;
  const data = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(data);

  // Get max amplitude weighted toward vocal frequencies
  let maxRaw = 0;
  for (let i = 0; i < data.length; i++) {
    if (data[i] > maxRaw) maxRaw = data[i];
  }

  // Smooth with previous
  const rawSmoothed = maxRaw * 0.6 + (lastDb - 60) / 60 * 255 * 0.4;
  const db = rawToDb(rawSmoothed);
  lastDb = db;

  if (db > maxDbSession) maxDbSession = db;

  updateUI(db, data);
  animFrameId = requestAnimationFrame(loop);
}

function updateUI(db, freqData) {
  // Number display
  const numEl = document.getElementById('dbNumber');
  numEl.textContent = db;
  numEl.style.color = dbToBarColor(db);
  numEl.style.textShadow = `0 0 60px ${dbToBarColor(db)}`;

  // Emoji
  const emojiEl = document.getElementById('dbEmoji');
  emojiEl.textContent = dbToEmoji(db);
  const scale = 1 + (db - 60) / 60 * 0.6;
  emojiEl.style.transform = `scale(${scale})`;

  // Bars
  const color = dbToBarColor(db);
  for (let i = 0; i < bars.length; i++) {
    const freqIndex = Math.floor(i * freqData.length / bars.length);
    const val = freqData[freqIndex];
    const h = Math.max(10, (val / 255) * 190);
    bars[i].style.height = h + 'px';
    // Color gradient from left to right
    const progress = i / bars.length;
    if (db >= 95) {
      bars[i].style.background = progress < 0.4 ? '#06D6A0' : progress < 0.7 ? '#FFE135' : progress < 0.9 ? '#FF6B35' : '#FF0000';
    } else {
      bars[i].style.background = color;
    }
  }

  // Needle
  const needlePct = dbToNeedlePercent(db);
  document.getElementById('scaleNeedle').style.left = needlePct + '%';
}

function stopRecording() {
  if (!isRecording) return;
  isRecording = false;
  cancelAnimationFrame(animFrameId);

  if (streamRef) streamRef.getTracks().forEach(t => t.stop());
  if (sourceNode) sourceNode.disconnect();
  if (audioCtx) audioCtx.close();

  document.getElementById('btnStart').disabled = false;
  document.getElementById('btnStop').disabled = true;
  document.getElementById('btnSave').disabled = false;

  const dot = document.getElementById('statusDot');
  const label = document.getElementById('recordingLabel');
  dot.classList.remove('recording');
  label.classList.remove('active');
  label.textContent = `✅ Grabación terminada · Máx: ${maxDbSession} dB`;

  // Freeze bars at zero
  bars.forEach(b => { b.style.height = '10px'; });
  document.getElementById('dbNumber').textContent = maxDbSession;
  document.getElementById('scaleNeedle').style.left = dbToNeedlePercent(maxDbSession) + '%';
  document.getElementById('dbEmoji').textContent = dbToEmoji(maxDbSession);
}

// ===== SCORES =====
let scores = []; // { name, db }

function saveScore() {
  const name = document.getElementById('teamName').value.trim();
  if (!name) { showToast('✏️ Escribe el nombre del equipo'); return; }
  scores.push({ name, db: maxDbSession });
  scores.sort((a, b) => b.db - a.db);
  document.getElementById('teamName').value = '';
  document.getElementById('btnSave').disabled = true;
  showToast(`🎉 "${name}" guardado con ${maxDbSession} dB!`);
}

// ===== RENDER SCORES =====
function renderScores() {
  const list = document.getElementById('scoresList');
  list.innerHTML = '';

  if (scores.length === 0) {
    list.innerHTML = `<div class="empty-state"><span class="empty-emoji">🎤</span>Aún no hay puntuaciones.<br>¡Vuelve a grabar!</div>`;
    return;
  }

  const maxDb = scores[0].db;
  const medals = ['🥇','🥈','🥉'];

  scores.forEach((s, i) => {
    const pct = Math.max(5, ((s.db - 60) / 60) * 100);
    const card = document.createElement('div');
    card.className = 'score-card';
    card.innerHTML = `
      <div class="score-rank">${medals[i] || (i+1) + 'º'}</div>
      <div style="flex:1">
        <div class="score-team">${escapeHtml(s.name)}</div>
        <div class="score-bar-mini"><div class="score-bar-fill" style="width:${pct}%"></div></div>
      </div>
      <div class="score-db-wrap">
        <div class="score-db">${s.db}</div>
        <div class="score-db-label">dB</div>
      </div>
    `;
    // delay animation
    card.style.animationDelay = (i * 0.08) + 's';
    list.appendChild(card);
  });
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
