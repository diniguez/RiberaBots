<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, initial-scale=1.0" />
  <title>🤖 Robot Jetracer — Panel de Control</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet" />
  <style>
    /* ─── Variables & Reset ──────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sky:    #a8edff;
      --cloud:  #ffffff;
      --sun:    #ffe033;
      --grass:  #6ee86e;
      --ground: #4ac94a;
      --btn-fw:   #ff6b35;
      --btn-bw:   #6a4cf7;
      --btn-fl:   #00c49a;
      --btn-fr:   #ff9f1c;
      --btn-bl:   #e63580;
      --btn-br:   #38bdf8;
      --shadow:   rgba(0,0,0,0.22);
      --txt:      #1a1a2e;

      /* Tamaño base = pantalla efectiva 1080×1920 dentro de Chrome fullscreen */
      --fs-title: clamp(2.8rem, 6vw, 5.5rem);
      --fs-label: clamp(1.4rem, 3.2vw, 2.6rem);
      --fs-icon:  clamp(3rem,  7vw,  6rem);
      --btn-r:    2.4rem;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--sky);
      font-family: 'Nunito', sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ─── Animated Background ────────────────────────────────────── */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: linear-gradient(180deg, #b8f0ff 0%, #dff7ff 38%, #c2f5a0 68%, #6ee86e 100%);
      overflow: hidden;
    }

    /* Floating clouds */
    .cloud {
      position: absolute;
      background: #fff;
      border-radius: 50px;
      opacity: 0.85;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.08));
      animation: drift linear infinite;
    }
    .cloud::before, .cloud::after {
      content: '';
      position: absolute;
      background: #fff;
      border-radius: 50%;
    }
    .c1 { width:200px; height:70px; top:4%;  left:-220px; animation-duration:28s; animation-delay:-5s; }
    .c1::before { width:100px; height:90px; top:-45px; left:30px; }
    .c1::after  { width:80px;  height:70px; top:-30px; left:100px; }

    .c2 { width:140px; height:50px; top:11%; left:-160px; animation-duration:22s; animation-delay:-12s; opacity:0.65; }
    .c2::before { width:70px;  height:65px; top:-35px; left:20px; }
    .c2::after  { width:55px;  height:50px; top:-25px; left:70px; }

    .c3 { width:260px; height:85px; top:19%; left:-280px; animation-duration:35s; animation-delay:-20s; }
    .c3::before { width:120px; height:110px; top:-55px; left:40px; }
    .c3::after  { width:100px; height:85px;  top:-40px; left:130px; }

    @keyframes drift {
      from { transform: translateX(0); }
      to   { transform: translateX(calc(100vw + 320px)); }
    }

    /* Sun */
    .sun {
      position: absolute;
      top: 3%;
      right: 7%;
      width: 130px;
      height: 130px;
      background: radial-gradient(circle, #fff7a0 0%, #ffe033 55%, #ffb700 100%);
      border-radius: 50%;
      box-shadow: 0 0 60px 20px #ffe03380, 0 0 120px 40px #ffb70040;
      animation: pulse-sun 4s ease-in-out infinite;
      z-index: 1;
    }
    @keyframes pulse-sun {
      0%,100% { box-shadow: 0 0 60px 20px #ffe03380, 0 0 120px 40px #ffb70040; }
      50%      { box-shadow: 0 0 80px 30px #ffe033aa, 0 0 160px 60px #ffb70060; }
    }

    /* Stars (small decorative circles scattered) */
    .star {
      position: absolute;
      border-radius: 50%;
      background: #ffe033;
      opacity: 0.7;
      animation: twinkle 2.5s ease-in-out infinite alternate;
    }
    @keyframes twinkle {
      from { opacity: 0.4; transform: scale(0.8); }
      to   { opacity: 1;   transform: scale(1.2); }
    }

    /* ─── Layout ──────────────────────────────────────────────────── */
    .panel {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      height: 100%;
      padding: 3.5vh 4vw 4vh;
      gap: 2vh;
    }

    /* ─── Header ──────────────────────────────────────────────────── */
    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.8vh;
    }

    .robot-mascot {
      font-size: clamp(4rem, 9vw, 8rem);
      line-height: 1;
      filter: drop-shadow(0 6px 16px rgba(0,0,0,0.18));
      animation: bob 2.8s ease-in-out infinite;
    }
    @keyframes bob {
      0%,100% { transform: translateY(0) rotate(-3deg); }
      50%      { transform: translateY(-12px) rotate(3deg); }
    }

    .title {
      font-family: 'Fredoka One', cursive;
      font-size: var(--fs-title);
      color: #fff;
      text-shadow:
        0 4px 0 #0080c0,
        0 8px 20px rgba(0,120,200,0.4);
      letter-spacing: 0.02em;
      text-align: center;
      line-height: 1.1;
    }

    .subtitle {
      font-size: clamp(1rem, 2.4vw, 1.9rem);
      color: #e8faff;
      font-weight: 700;
      text-shadow: 0 2px 8px rgba(0,80,160,0.3);
      letter-spacing: 0.08em;
    }

    /* ─── Status pill ──────────────────────────────────────────────── */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(8px);
      border-radius: 100px;
      padding: 0.7rem 2rem;
      font-size: clamp(0.9rem, 2vw, 1.5rem);
      font-weight: 900;
      color: var(--txt);
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
      transition: all 0.4s;
    }
    .status-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #aaa;
      transition: background 0.4s;
      flex-shrink: 0;
    }
    .status-bar.connected .status-dot { background: #22c55e; animation: blink 1.2s ease-in-out infinite; }
    .status-bar.error      .status-dot { background: #ef4444; }
    .status-bar.moving     .status-dot { background: #f59e0b; animation: blink 0.5s ease-in-out infinite; }
    @keyframes blink {
      0%,100% { opacity: 1; }
      50%      { opacity: 0.3; }
    }

    /* ─── Grid de botones ─────────────────────────────────────────── */
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto auto auto;
      gap: clamp(1rem, 2.5vh, 2.5rem);
      width: 100%;
      max-width: 900px;
      flex: 1;
      align-content: center;
    }

    /* Botón adelante: ocupa columnas 1-2 (centro) */
    .btn-forward { grid-column: 1 / 3; justify-self: center; width: 55%; }

    /* Botón atrás: ocupa columnas 1-2 (centro) */
    .btn-backward { grid-column: 1 / 3; justify-self: center; width: 55%; }

    /* ─── Botón base ──────────────────────────────────────────────── */
    .btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      border: none;
      border-radius: var(--btn-r);
      cursor: pointer;
      padding: clamp(1.4rem, 3.5vh, 3.2rem) clamp(1rem, 2vw, 2rem);
      font-family: 'Fredoka One', cursive;
      font-size: var(--fs-label);
      color: #fff;
      text-shadow: 0 2px 6px rgba(0,0,0,0.25);
      position: relative;
      overflow: hidden;
      transition:
        transform 0.12s cubic-bezier(.34,1.56,.64,1),
        filter 0.15s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      min-height: clamp(130px, 18vh, 220px);
    }

    /* Bottom shadow (3D feel) */
    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(180deg, rgba(255,255,255,0.28) 0%, rgba(255,255,255,0) 60%);
      pointer-events: none;
    }

    /* Ripple on press */
    .btn::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.5);
      width: 0; height: 0;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      opacity: 0;
      transition: width 0.5s ease, height 0.5s ease, opacity 0.5s ease;
    }
    .btn:active::after {
      width: 320px; height: 320px; opacity: 0;
    }

    .btn:active {
      transform: scale(0.94) translateY(4px);
      filter: brightness(0.88);
    }

    .btn-icon {
      font-size: var(--fs-icon);
      line-height: 1;
      display: block;
    }

    .btn-label {
      display: block;
      letter-spacing: 0.03em;
      text-align: center;
      line-height: 1.2;
    }

    /* ─── Colores individuales ────────────────────────────────────── */
    .btn-forward {
      background: linear-gradient(145deg, #ff8a50, var(--btn-fw));
      box-shadow:
        0 10px 0 #c83a00,
        0 14px 30px rgba(255,107,53,0.5);
    }
    .btn-forward:active { box-shadow: 0 4px 0 #c83a00, 0 6px 16px rgba(255,107,53,0.4); }

    .btn-backward {
      background: linear-gradient(145deg, #9b7aff, var(--btn-bw));
      box-shadow:
        0 10px 0 #3a1aaa,
        0 14px 30px rgba(106,76,247,0.5);
    }
    .btn-backward:active { box-shadow: 0 4px 0 #3a1aaa, 0 6px 16px rgba(106,76,247,0.4); }

    .btn-fl {
      background: linear-gradient(145deg, #30e8b8, var(--btn-fl));
      box-shadow:
        0 10px 0 #008060,
        0 14px 30px rgba(0,196,154,0.5);
    }
    .btn-fl:active { box-shadow: 0 4px 0 #008060, 0 6px 16px rgba(0,196,154,0.4); }

    .btn-fr {
      background: linear-gradient(145deg, #ffc84a, var(--btn-fr));
      box-shadow:
        0 10px 0 #b06000,
        0 14px 30px rgba(255,159,28,0.5);
    }
    .btn-fr:active { box-shadow: 0 4px 0 #b06000, 0 6px 16px rgba(255,159,28,0.4); }

    .btn-bl {
      background: linear-gradient(145deg, #ff6aae, var(--btn-bl));
      box-shadow:
        0 10px 0 #8a0050,
        0 14px 30px rgba(230,53,128,0.5);
    }
    .btn-bl:active { box-shadow: 0 4px 0 #8a0050, 0 6px 16px rgba(230,53,128,0.4); }

    .btn-br {
      background: linear-gradient(145deg, #7edcff, var(--btn-br));
      box-shadow:
        0 10px 0 #0070a0,
        0 14px 30px rgba(56,189,248,0.5);
    }
    .btn-br:active { box-shadow: 0 4px 0 #0070a0, 0 6px 16px rgba(56,189,248,0.4); }

    /* ─── Footer ──────────────────────────────────────────────────── */
    .footer {
      font-size: clamp(0.75rem, 1.6vw, 1.2rem);
      color: rgba(255,255,255,0.7);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-align: center;
    }

    /* ─── Toast notificación ──────────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 4vh;
      left: 50%;
      transform: translateX(-50%) translateY(120px);
      background: rgba(20,20,40,0.92);
      color: #fff;
      font-size: clamp(1rem, 2.2vw, 1.8rem);
      font-weight: 900;
      padding: 1rem 2.4rem;
      border-radius: 100px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
      z-index: 999;
      transition: transform 0.4s cubic-bezier(.34,1.56,.64,1), opacity 0.4s;
      opacity: 0;
      pointer-events: none;
      white-space: nowrap;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* ─── Efecto "pisando" el suelo ───────────────────────────────── */
    .ground-strip {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 80px;
      background: linear-gradient(180deg, transparent, #4ac94a88, #2d8a2d);
      z-index: 2;
      pointer-events: none;
    }

    /* Responsive extra-fine tuning para escala 200% (1080px efectivo) */
    @media (max-width: 600px) {
      .btn { min-height: 110px; }
      .btn-forward, .btn-backward { width: 70%; }
    }
  </style>
</head>
<body>

<!-- ── Fondo animado ── -->
<div class="bg">
  <div class="sun"></div>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>
  <!-- Estrellas decorativas -->
  <div class="star" style="width:18px;height:18px;top:28%;left:6%;animation-delay:0s;"></div>
  <div class="star" style="width:12px;height:12px;top:33%;left:88%;animation-delay:0.8s;"></div>
  <div class="star" style="width:22px;height:22px;top:52%;left:5%;animation-delay:1.5s;"></div>
  <div class="star" style="width:14px;height:14px;top:58%;left:91%;animation-delay:0.3s;"></div>
  <div class="star" style="width:10px;height:10px;top:72%;left:10%;animation-delay:2s;"></div>
</div>

<div class="ground-strip"></div>

<!-- ── Panel principal ── -->
<div class="panel">

  <!-- HEADER -->
  <div class="header">
    <div class="robot-mascot">🤖</div>
    <h1 class="title">Panel de Control</h1>
    <p class="subtitle">¡Mueve a tu robot!</p>
  </div>

  <!-- ESTADO DE CONEXIÓN -->
  <div class="status-bar" id="statusBar">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Conectando con el robot…</span>
  </div>

  <!-- BOTONES DE MOVIMIENTO -->
  <div class="btn-grid">

    <!-- Fila 1: Adelante izquierda | Adelante derecha -->
    <button class="btn btn-fl" onclick="sendMove('forward-left', this)" aria-label="Avanzar a la izquierda">
      <span class="btn-icon">↖️</span>
      <span class="btn-label">Adelante<br>Izquierda</span>
    </button>

    <button class="btn btn-fr" onclick="sendMove('forward-right', this)" aria-label="Avanzar a la derecha">
      <span class="btn-icon">↗️</span>
      <span class="btn-label">Adelante<br>Derecha</span>
    </button>

    <!-- Fila 2: Adelante recto (centrado) -->
    <button class="btn btn-forward btn-forward" onclick="sendMove('forward', this)" aria-label="Avanzar recto">
      <span class="btn-icon">⬆️</span>
      <span class="btn-label">¡Adelante!</span>
    </button>

    <!-- Fila 3: Atrás recto (centrado) -->
    <button class="btn btn-backward btn-backward" onclick="sendMove('backward', this)" aria-label="Retroceder recto">
      <span class="btn-icon">⬇️</span>
      <span class="btn-label">¡Atrás!</span>
    </button>

    <!-- Fila 4: Atrás izquierda | Atrás derecha -->
    <button class="btn btn-bl" onclick="sendMove('backward-left', this)" aria-label="Retroceder a la izquierda">
      <span class="btn-icon">↙️</span>
      <span class="btn-label">Atrás<br>Izquierda</span>
    </button>

    <button class="btn btn-br" onclick="sendMove('backward-right', this)" aria-label="Retroceder a la derecha">
      <span class="btn-icon">↘️</span>
      <span class="btn-label">Atrás<br>Derecha</span>
    </button>

  </div>

  <!-- FOOTER -->
  <p class="footer">Jetracer Robomaster TT &nbsp;•&nbsp; WiFi Control</p>
</div>

<!-- Toast de feedback -->
<div class="toast" id="toast"></div>

<script>
  // ─── Configuración ──────────────────────────────────────────────
  const SERVER = "http://localhost:5000"; // IP del PC donde corre el servidor Python

  // ─── Referencias DOM ────────────────────────────────────────────
  const statusBar  = document.getElementById("statusBar");
  const statusDot  = document.getElementById("statusDot");
  const statusText = document.getElementById("statusText");
  const toast      = document.getElementById("toast");

  let toastTimer = null;

  // ─── Mensajes amigables por acción ──────────────────────────────
  const MESSAGES = {
    "forward":       "🚀 ¡Vamos adelante!",
    "backward":      "⏪ ¡Marcha atrás!",
    "forward-left":  "↖️ ¡Gira a la izquierda!",
    "forward-right": "↗️ ¡Gira a la derecha!",
    "backward-left": "↙️ ¡Atrás a la izquierda!",
    "backward-right":"↘️ ¡Atrás a la derecha!",
  };

  // ─── Enviar movimiento al servidor ──────────────────────────────
  async function sendMove(action, btnEl) {
    // Feedback visual inmediato
    showToast(MESSAGES[action] || "Moviendo…");
    setStatus("moving", "Ejecutando: " + action);

    try {
      const res = await fetch(`${SERVER}/move/${action}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" }
      });

      if (res.ok) {
        const data = await res.json();
        setStatus("connected", "✅ ¡Robot listo!");
      } else {
        setStatus("error", "⚠️ Error del servidor");
      }
    } catch (err) {
      setStatus("error", "❌ Sin conexión al servidor");
      showToast("❌ No se puede conectar con el servidor");
      console.error("Error:", err);
    }
  }

  // ─── Estado de la barra de conexión ─────────────────────────────
  function setStatus(state, text) {
    statusBar.className = "status-bar " + state;
    statusText.textContent = text;
  }

  // ─── Toast de feedback ───────────────────────────────────────────
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 2000);
  }

  // ─── Verificar conexión al cargar ────────────────────────────────
  async function checkConnection() {
    try {
      const res = await fetch(`${SERVER}/status`, { method: "GET" });
      if (res.ok) {
        const data = await res.json();
        const mode = data.robot_connected ? "real 🤖" : "simulación 🖥️";
        setStatus("connected", `Conectado — modo ${mode}`);
      } else {
        setStatus("error", "Servidor sin respuesta");
      }
    } catch {
      setStatus("error", "❌ Servidor no encontrado — ¿está Python corriendo?");
    }
  }

  // ─── Bloquear gestos del sistema en el kiosko ────────────────────
  document.addEventListener("contextmenu", e => e.preventDefault());
  document.addEventListener("keydown", e => {
    if (["F5","F11","F12"].includes(e.key) || (e.ctrlKey && ["r","R","w","W"].includes(e.key))) {
      e.preventDefault();
    }
  });

  // ─── Ping periódico cada 10 s ────────────────────────────────────
  checkConnection();
  setInterval(checkConnection, 10000);
</script>

</body>
</html>
