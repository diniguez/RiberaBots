<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎤 Medidor de Decibelios</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --amarillo: #FFD93D;
    --naranja: #FF6B35;
    --rosa: #FF4D6D;
    --morado: #9B5DE5;
    --azul: #00BBF9;
    --verde: #06D6A0;
    --fondo: #1A1A2E;
    --fondo2: #16213E;
    --blanco: #FFFFFF;
    --radio: 40px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--fondo);
    font-family: 'Nunito', sans-serif;
    color: var(--blanco);
    touch-action: manipulation;
  }

  /* ===== ESTRELLAS DE FONDO ===== */
  .estrellas {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .estrella {
    position: absolute;
    border-radius: 50%;
    background: white;
    animation: parpadeo var(--dur) ease-in-out infinite;
    opacity: 0;
  }
  @keyframes parpadeo {
    0%, 100% { opacity: 0; transform: scale(0.8); }
    50% { opacity: 0.7; transform: scale(1.2); }
  }

  /* ===== VISTAS ===== */
  .vista {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    z-index: 1;
    padding: 60px 50px 40px;
    overflow: hidden;
  }
  .vista.activa { display: flex; }

  /* ===== TÍTULO ===== */
  .titulo {
    font-family: 'Fredoka One', cursive;
    font-size: 90px;
    text-align: center;
    line-height: 1;
    margin-bottom: 30px;
    filter: drop-shadow(0 6px 20px rgba(0,0,0,0.4));
    animation: bounceIn 0.6s cubic-bezier(.36,.07,.19,.97);
  }
  .titulo span { display: inline-block; }
  @keyframes bounceIn {
    0% { transform: scale(0.5) rotate(-5deg); opacity: 0; }
    70% { transform: scale(1.08) rotate(1deg); opacity: 1; }
    100% { transform: scale(1) rotate(0); }
  }

  /* ===== MEDIDOR ===== */
  .medidor-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
    flex: 1;
    justify-content: center;
    width: 100%;
  }

  /* Número DB */
  .db-numero {
    font-family: 'Fredoka One', cursive;
    font-size: 220px;
    line-height: 1;
    text-align: center;
    transition: color 0.2s, transform 0.1s;
    filter: drop-shadow(0 0 40px currentColor);
    color: var(--verde);
    position: relative;
  }
  .db-numero .db-label {
    font-size: 70px;
    vertical-align: middle;
    opacity: 0.7;
  }
  .db-numero.pulsando {
    animation: pulso 0.15s ease-out;
  }
  @keyframes pulso {
    0% { transform: scale(1); }
    50% { transform: scale(1.06); }
    100% { transform: scale(1); }
  }

  /* Emoji reactivo */
  .emoji-cara {
    font-size: 180px;
    line-height: 1;
    filter: drop-shadow(0 10px 30px rgba(0,0,0,0.5));
    transition: all 0.3s;
    animation: flotando 3s ease-in-out infinite;
  }
  @keyframes flotando {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-20px) rotate(3deg); }
  }

  /* Barra de nivel */
  .barra-wrap {
    width: 100%;
    max-width: 900px;
    background: rgba(255,255,255,0.1);
    border-radius: 50px;
    height: 80px;
    overflow: hidden;
    border: 5px solid rgba(255,255,255,0.2);
    position: relative;
  }
  .barra-fill {
    height: 100%;
    border-radius: 50px;
    width: 0%;
    transition: width 0.1s ease-out, background 0.3s;
    background: linear-gradient(90deg, var(--verde), var(--azul), var(--amarillo), var(--naranja), var(--rosa));
    background-size: 200% 100%;
    animation: barraFlow 2s linear infinite;
    position: relative;
  }
  @keyframes barraFlow {
    0% { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
  }
  .barra-fill::after {
    content: '';
    position: absolute;
    right: -3px;
    top: 50%;
    transform: translateY(-50%);
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: white;
    box-shadow: 0 0 20px white;
  }

  /* Etiquetas barra */
  .barra-labels {
    display: flex;
    justify-content: space-between;
    width: 100%;
    max-width: 900px;
    font-size: 32px;
    font-weight: 800;
    margin-top: 8px;
    padding: 0 10px;
  }

  /* ONDAS de sonido animadas */
  .ondas {
    display: flex;
    align-items: flex-end;
    gap: 14px;
    height: 120px;
    justify-content: center;
    width: 100%;
    max-width: 700px;
  }
  .onda {
    width: 22px;
    border-radius: 20px;
    background: var(--azul);
    transition: height 0.1s ease-out, background 0.3s;
    min-height: 15px;
    box-shadow: 0 0 15px currentColor;
  }

  /* ===== ESTADO GRABANDO ===== */
  .indicador-grabando {
    display: none;
    align-items: center;
    gap: 20px;
    font-size: 48px;
    font-weight: 900;
    color: var(--rosa);
    animation: parpadeoRojo 1s ease-in-out infinite;
  }
  .indicador-grabando.visible { display: flex; }
  .dot-rojo {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--rosa);
    box-shadow: 0 0 25px var(--rosa);
  }
  @keyframes parpadeoRojo {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* ===== BOTONES ===== */
  .botones-area {
    display: flex;
    flex-direction: column;
    gap: 25px;
    width: 100%;
    max-width: 900px;
    margin-top: 30px;
  }

  .fila-botones {
    display: flex;
    gap: 25px;
    width: 100%;
    justify-content: center;
  }

  .btn {
    font-family: 'Fredoka One', cursive;
    font-size: 52px;
    border: none;
    border-radius: var(--radio);
    padding: 30px 60px;
    cursor: pointer;
    transition: transform 0.12s, box-shadow 0.12s;
    flex: 1;
    letter-spacing: 1px;
    position: relative;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.15);
    opacity: 0;
    transition: opacity 0.2s;
    border-radius: inherit;
  }
  .btn:active::after { opacity: 1; }
  .btn:active { transform: scale(0.95) !important; }
  .btn:hover { transform: scale(1.03); }

  .btn-empezar {
    background: linear-gradient(135deg, var(--verde), #04a07a);
    color: white;
    box-shadow: 0 12px 0 #028c6a, 0 16px 40px rgba(6,214,160,0.4);
  }
  .btn-empezar:hover { box-shadow: 0 16px 0 #028c6a, 0 20px 50px rgba(6,214,160,0.5); }
  .btn-empezar:active { box-shadow: 0 4px 0 #028c6a; }

  .btn-terminar {
    background: linear-gradient(135deg, var(--rosa), #c9304d);
    color: white;
    box-shadow: 0 12px 0 #a8253e, 0 16px 40px rgba(255,77,109,0.4);
  }
  .btn-terminar:hover { box-shadow: 0 16px 0 #a8253e, 0 20px 50px rgba(255,77,109,0.5); }
  .btn-terminar:active { box-shadow: 0 4px 0 #a8253e; }

  .btn-guardar {
    background: linear-gradient(135deg, var(--amarillo), #e8c22a);
    color: #1A1A2E;
    box-shadow: 0 12px 0 #c9a820, 0 16px 40px rgba(255,217,61,0.4);
    flex: 0 0 auto;
    padding: 30px 50px;
  }
  .btn-guardar:hover { box-shadow: 0 16px 0 #c9a820, 0 20px 50px rgba(255,217,61,0.5); }
  .btn-guardar:active { box-shadow: 0 4px 0 #c9a820; }

  .btn-tabla {
    background: linear-gradient(135deg, var(--morado), #7b3fd4);
    color: white;
    box-shadow: 0 12px 0 #6230b0, 0 16px 40px rgba(155,93,229,0.4);
    width: 100%;
  }
  .btn-tabla:hover { box-shadow: 0 16px 0 #6230b0, 0 20px 50px rgba(155,93,229,0.5); }
  .btn-tabla:active { box-shadow: 0 4px 0 #6230b0; }

  /* Input nombre equipo */
  .input-wrap {
    display: flex;
    gap: 20px;
    width: 100%;
    align-items: center;
  }
  .input-equipo {
    font-family: 'Nunito', sans-serif;
    font-size: 50px;
    font-weight: 800;
    border: 5px solid rgba(255,255,255,0.3);
    border-radius: var(--radio);
    padding: 25px 40px;
    background: rgba(255,255,255,0.1);
    color: white;
    flex: 1;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
    backdrop-filter: blur(10px);
  }
  .input-equipo::placeholder { color: rgba(255,255,255,0.4); }
  .input-equipo:focus {
    border-color: var(--azul);
    background: rgba(0,187,249,0.1);
    box-shadow: 0 0 30px rgba(0,187,249,0.3);
  }

  /* ===== VISTA TABLA ===== */
  .titulo-tabla {
    font-family: 'Fredoka One', cursive;
    font-size: 100px;
    text-align: center;
    background: linear-gradient(90deg, var(--amarillo), var(--naranja), var(--rosa));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 40px;
    filter: drop-shadow(0 4px 15px rgba(255,107,53,0.4));
  }

  .tabla-contenedor {
    flex: 1;
    width: 100%;
    overflow-y: auto;
    padding: 0 20px 20px;
    scrollbar-width: thin;
    scrollbar-color: var(--azul) rgba(255,255,255,0.1);
  }
  .tabla-contenedor::-webkit-scrollbar { width: 12px; }
  .tabla-contenedor::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 20px; }
  .tabla-contenedor::-webkit-scrollbar-thumb { background: var(--azul); border-radius: 20px; }

  .tabla {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0 20px;
  }
  .tabla thead th {
    font-family: 'Fredoka One', cursive;
    font-size: 54px;
    padding: 20px 40px;
    text-align: left;
    opacity: 0.7;
    letter-spacing: 2px;
  }
  .tabla-fila {
    animation: slideIn 0.4s cubic-bezier(.36,.07,.19,.97) both;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-40px); }
    to { opacity: 1; transform: translateX(0); }
  }
  .tabla-fila td {
    padding: 28px 40px;
    font-size: 58px;
    font-weight: 800;
  }
  .tabla-fila td:first-child {
    border-radius: 30px 0 0 30px;
  }
  .tabla-fila td:last-child {
    border-radius: 0 30px 30px 0;
    text-align: right;
  }
  .puesto-1 { background: linear-gradient(90deg, rgba(255,217,61,0.3), rgba(255,217,61,0.1)); border-left: 8px solid var(--amarillo); }
  .puesto-2 { background: linear-gradient(90deg, rgba(192,192,192,0.3), rgba(192,192,192,0.1)); border-left: 8px solid #C0C0C0; }
  .puesto-3 { background: linear-gradient(90deg, rgba(205,127,50,0.3), rgba(205,127,50,0.1)); border-left: 8px solid #CD7F32; }
  .puesto-n { background: rgba(255,255,255,0.07); border-left: 8px solid rgba(255,255,255,0.2); }

  .medalla { font-size: 70px; margin-right: 20px; }
  .db-score {
    font-family: 'Fredoka One', cursive;
    color: var(--azul);
  }

  .vacío-msg {
    text-align: center;
    font-size: 60px;
    opacity: 0.4;
    padding: 80px;
    font-weight: 700;
  }

  .btn-volver {
    background: linear-gradient(135deg, var(--azul), #0090c9);
    color: #1A1A2E;
    box-shadow: 0 12px 0 #0070a0, 0 16px 40px rgba(0,187,249,0.4);
    width: 100%;
    margin-top: 30px;
    font-size: 56px;
  }
  .btn-volver:hover { box-shadow: 0 16px 0 #0070a0, 0 20px 50px rgba(0,187,249,0.5); }
  .btn-volver:active { box-shadow: 0 4px 0 #0070a0; }

  /* ===== TOAST ===== */
  .toast {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(30px);
    background: var(--verde);
    color: #1A1A2E;
    font-family: 'Fredoka One', cursive;
    font-size: 54px;
    padding: 25px 60px;
    border-radius: var(--radio);
    box-shadow: 0 15px 50px rgba(0,0,0,0.5);
    opacity: 0;
    transition: all 0.4s cubic-bezier(.36,.07,.19,.97);
    z-index: 999;
    white-space: nowrap;
  }
  .toast.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* Efecto confeti al guardar */
  .confeti-piece {
    position: fixed;
    width: 22px;
    height: 22px;
    border-radius: 4px;
    pointer-events: none;
    z-index: 998;
    animation: caerConfeti 1.5s ease-in forwards;
  }
  @keyframes caerConfeti {
    0% { transform: translateY(-50px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }

  /* Fondo decorativo */
  .deco-circle {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
    opacity: 0.06;
    animation: girar var(--g) linear infinite;
  }
  @keyframes girar {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>

<!-- Fondo estrellas -->
<div class="estrellas" id="estrellas"></div>

<!-- Círculos decorativos de fondo -->
<div class="deco-circle" style="width:800px;height:800px;border:60px solid var(--azul);top:-300px;right:-200px;--g:20s;"></div>
<div class="deco-circle" style="width:600px;height:600px;border:50px solid var(--rosa);bottom:-200px;left:-150px;--g:15s;animation-direction:reverse;"></div>
<div class="deco-circle" style="width:400px;height:400px;border:40px solid var(--amarillo);bottom:200px;right:-100px;--g:25s;"></div>

<!-- ===== VISTA MEDIDOR ===== -->
<div class="vista activa" id="vista-medidor">
  
  <div class="titulo" style="background: linear-gradient(90deg, var(--azul), var(--morado), var(--rosa)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;">
    🎤 ¡Medidor de Gritos!
  </div>

  <div class="indicador-grabando" id="indicador-grabando">
    <div class="dot-rojo"></div>
    GRABANDO...
  </div>

  <div class="medidor-wrap">
    <div class="emoji-cara" id="emoji-cara">😴</div>

    <div class="db-numero" id="db-numero">
      0 <span class="db-label">dB</span>
    </div>

    <div class="barra-wrap">
      <div class="barra-fill" id="barra-fill"></div>
    </div>
    <div class="barra-labels">
      <span style="color:var(--verde)">🔇 Silencio</span>
      <span style="color:var(--amarillo)">😄 Normal</span>
      <span style="color:var(--rosa)">🔥 ¡BRUTAL!</span>
    </div>

    <div class="ondas" id="ondas"></div>
  </div>

  <!-- Controles -->
  <div class="botones-area">
    <div class="fila-botones">
      <button class="btn btn-empezar" id="btn-empezar" onclick="empezarGrabacion()">
        🎙️ Empezar a Grabar
      </button>
      <button class="btn btn-terminar" id="btn-terminar" onclick="terminarGrabacion()" disabled style="opacity:0.5">
        ⏹️ Terminar de Grabar
      </button>
    </div>

    <div class="fila-botones input-wrap">
      <input
        class="input-equipo"
        id="input-equipo"
        type="text"
        placeholder="✏️ Nombre del equipo..."
        maxlength="30"
      />
      <button class="btn btn-guardar" onclick="guardarEquipo()">
        💾 Guardar
      </button>
    </div>

    <button class="btn btn-tabla" onclick="mostrarTabla()">
      🏆 Ver Tabla de Resultados
    </button>
  </div>
</div>

<!-- ===== VISTA TABLA ===== -->
<div class="vista" id="vista-tabla">
  <div class="titulo-tabla">🏆 Tabla de Campeones</div>

  <div class="tabla-contenedor">
    <table class="tabla" id="tabla-resultados">
      <thead>
        <tr>
          <th>#</th>
          <th>Equipo</th>
          <th style="text-align:right">Decibelios</th>
        </tr>
      </thead>
      <tbody id="tabla-body">
        <tr><td colspan="3" class="vacío-msg">🎤 ¡Aún no hay resultados!</td></tr>
      </tbody>
    </table>
  </div>

  <button class="btn btn-volver" onclick="volverMedidor()">
    ⬅️ Volver al Medidor
  </button>
</div>

<!-- Toast notificación -->
<div class="toast" id="toast"></div>

<script>
// ===== ESTRELLAS DECORATIVAS =====
(function() {
  const cont = document.getElementById('estrellas');
  for (let i = 0; i < 80; i++) {
    const e = document.createElement('div');
    e.className = 'estrella';
    const sz = Math.random() * 6 + 2;
    e.style.cssText = `
      width:${sz}px; height:${sz}px;
      left:${Math.random()*100}%;
      top:${Math.random()*100}%;
      --dur:${(Math.random()*3+2).toFixed(1)}s;
      animation-delay:${(Math.random()*4).toFixed(1)}s;
    `;
    cont.appendChild(e);
  }
})();

// ===== ONDAS =====
(function() {
  const cont = document.getElementById('ondas');
  const colores = ['#00BBF9','#9B5DE5','#FF4D6D','#06D6A0','#FFD93D','#FF6B35'];
  for (let i = 0; i < 24; i++) {
    const b = document.createElement('div');
    b.className = 'onda';
    b.id = `onda-${i}`;
    b.style.background = colores[i % colores.length];
    b.style.height = '15px';
    cont.appendChild(b);
  }
})();

// ===== AUDIO =====
let audioCtx = null;
let analyser = null;
let source = null;
let stream = null;
let grabando = false;
let animFrame = null;
let maxDb = 0;
let equipos = JSON.parse(localStorage.getItem('equipos') || '[]');

const EMOJIS = [
  { min: 0,  max: 49, e: '😴' },
  { min: 50, max: 65, e: '🤫' },
  { min: 66, max: 70, e: '😊' },
  { min: 71, max: 80, e: '😄' },
  { min: 81, max: 90, e: '😲' },
  { min: 91, max: 95, e: '😱' },
  { min: 96, max: 999,e: '🔥' },
];

function getEmoji(db) {
  return EMOJIS.find(e => db >= e.min && db < e.max)?.e || '😴';
}

function getColor(pct) {
  if (pct < 0.7) return 'var(--verde)';
  if (pct < 0.80) return 'var(--amarillo)';
  if (pct < 0.85) return 'var(--naranja)';
  return 'var(--rosa)';
}

async function empezarGrabacion() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    analyser.smoothingTimeConstant = 0.6;
    source = audioCtx.createMediaStreamSource(stream);
    source.connect(analyser);
    grabando = true;
    maxDb = 0;

    document.getElementById('btn-empezar').disabled = true;
    document.getElementById('btn-empezar').style.opacity = '0.5';
    document.getElementById('btn-terminar').disabled = false;
    document.getElementById('btn-terminar').style.opacity = '1';
    document.getElementById('indicador-grabando').classList.add('visible');

    medirLoop();
  } catch (e) {
    mostrarToast('❌ No se pudo acceder al micrófono', '#FF4D6D');
    console.error(e);
  }
}

function terminarGrabacion() {
  grabando = false;
  if (animFrame) cancelAnimationFrame(animFrame);
  if (stream) stream.getTracks().forEach(t => t.stop());
  if (audioCtx) audioCtx.close();

  document.getElementById('btn-empezar').disabled = false;
  document.getElementById('btn-empezar').style.opacity = '1';
  document.getElementById('btn-terminar').disabled = true;
  document.getElementById('btn-terminar').style.opacity = '0.5';
  document.getElementById('indicador-grabando').classList.remove('visible');

  mostrarToast(`🎯 Máximo: ${maxDb.toFixed(1)} dB`, 'var(--azul)');
}

function medirLoop() {
  if (!grabando) return;
  const bufLen = analyser.frequencyBinCount;
  const data = new Uint8Array(bufLen);
  analyser.getByteFrequencyData(data);

  // Calcular dB
  let sum = 0;
  for (let i = 0; i < bufLen; i++) sum += data[i] * data[i];
  const rms = Math.sqrt(sum / bufLen);
  const db = rms > 0 ? Math.min(100, Math.round(20 * Math.log10(rms / 128) + 80)) : 0;
  const dbReal = Math.max(0, db);

  if (dbReal > maxDb) maxDb = dbReal;

  // Actualizar UI
  const pct = dbReal / 100;
  const color = getColor(pct);
  const numEl = document.getElementById('db-numero');
  numEl.innerHTML = `${dbReal} <span class="db-label">dB</span>`;
  numEl.style.color = color;

  document.getElementById('emoji-cara').textContent = getEmoji(dbReal);
  document.getElementById('barra-fill').style.width = `${pct * 100}%`;

  // Ondas
  for (let i = 0; i < 24; i++) {
    const onda = document.getElementById(`onda-${i}`);
    const h = Math.max(15, data[i * 2] * pct + 15);
    onda.style.height = `${Math.min(h, 115)}px`;
    onda.style.boxShadow = `0 0 ${10 + h / 5}px currentColor`;
  }

  animFrame = requestAnimationFrame(medirLoop);
}

// ===== GUARDAR EQUIPO =====
function guardarEquipo() {
  const nombre = document.getElementById('input-equipo').value.trim();
  if (!nombre) {
    mostrarToast('✏️ Escribe el nombre del equipo', '#FFD93D');
    return;
  }
  if (maxDb === 0) {
    mostrarToast('🎤 Graba primero para obtener tu puntuación', '#FF6B35');
    return;
  }

  const entrada = { nombre, db: parseFloat(maxDb.toFixed(1)), fecha: Date.now() };
  equipos.push(entrada);
  equipos.sort((a, b) => b.db - a.db);
  localStorage.setItem('equipos', JSON.stringify(equipos));

  mostrarToast(`🎉 ¡${nombre} guardado con ${maxDb.toFixed(1)} dB!`, 'var(--verde)');
  lanzarConfeti();
  document.getElementById('input-equipo').value = '';
  maxDb = 0;
}

// ===== TABLA =====
function mostrarTabla() {
  equipos = JSON.parse(localStorage.getItem('equipos') || '[]');
  const tbody = document.getElementById('tabla-body');
  tbody.innerHTML = '';

  if (equipos.length === 0) {
    tbody.innerHTML = '<tr><td colspan="3" class="vacío-msg">🎤 ¡Aún no hay resultados!</td></tr>';
  } else {
    const medallas = ['🥇','🥈','🥉'];
    equipos.forEach((eq, i) => {
      const tr = document.createElement('tr');
      tr.className = `tabla-fila ${i === 0 ? 'puesto-1' : i === 1 ? 'puesto-2' : i === 2 ? 'puesto-3' : 'puesto-n'}`;
      tr.style.animationDelay = `${i * 0.06}s`;
      tr.innerHTML = `
        <td><span class="medalla">${medallas[i] || (i+1)+'º'}</span></td>
        <td>${eq.nombre}</td>
        <td class="db-score">${eq.db} dB</td>
      `;
      tbody.appendChild(tr);
    });
  }

  document.getElementById('vista-medidor').classList.remove('activa');
  document.getElementById('vista-tabla').classList.add('activa');
}

function volverMedidor() {
  document.getElementById('vista-tabla').classList.remove('activa');
  document.getElementById('vista-medidor').classList.add('activa');
}

// ===== TOAST =====
function mostrarToast(msg, color = 'var(--verde)') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = color;
  t.style.color = (color === '#FFD93D' || color === 'var(--amarillo)') ? '#1A1A2E' : 'white';
  t.classList.add('visible');
  setTimeout(() => t.classList.remove('visible'), 3000);
}

// ===== CONFETI =====
function lanzarConfeti() {
  const colores = ['#FFD93D','#FF6B35','#FF4D6D','#9B5DE5','#00BBF9','#06D6A0'];
  for (let i = 0; i < 40; i++) {
    setTimeout(() => {
      const c = document.createElement('div');
      c.className = 'confeti-piece';
      c.style.cssText = `
        left: ${Math.random() * 100}%;
        top: -30px;
        background: ${colores[Math.floor(Math.random() * colores.length)]};
        animation-duration: ${(Math.random() * 1 + 1).toFixed(1)}s;
        animation-delay: 0s;
        transform: rotate(${Math.random() * 360}deg);
        border-radius: ${Math.random() > 0.5 ? '50%' : '4px'};
      `;
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 2000);
    }, i * 30);
  }
}
</script>
